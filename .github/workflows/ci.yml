name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Engine chip-conservation fuzz test
        run: npm run test:engine
      - name: Blackjack fuzz test
        run: npm run test:blackjack
      - name: Typecheck + build
        run: npm run build
